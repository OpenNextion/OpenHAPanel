<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="theme-color" content="#f8f9fa" />
        <script>
            (() => {
                const cachedTheme = localStorage.getItem('theme');
                const cachedFollowSystem = localStorage.getItem('themeFollowSystem');
                const followSystem = cachedFollowSystem === null ? true : cachedFollowSystem === 'true';
                const systemTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
                const theme = followSystem ? systemTheme : cachedTheme === 'dark' || cachedTheme === 'light' ? cachedTheme : systemTheme;
                document.documentElement.setAttribute('data-bs-theme', theme);
                document.querySelector('meta[name="theme-color"]')?.setAttribute('content', theme === 'dark' ? '#111827' : '#f4f5f9');
            })();
        </script>
        <meta name="description" content="OpenNextion device management" />
        <link rel="icon" href="<%= favicon %>" />
        <link rel="stylesheet" crossorigin="anonymous" href="https://cdn.jsdelivr.net/npm/misans@5.0.0/lib/Normal/MiSans-Medium.min.css" />
        <title>OpenNextion Device</title>
    </head>
    <body>
        <div id="app"></div>
        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
