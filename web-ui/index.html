<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="theme-color" content="#f8f9fa" />
        <script>
            (() => {
                const cachedTheme = localStorage.getItem('theme');
                const cachedFollowSystem = localStorage.getItem('themeFollowSystem');
                const followSystem = cachedFollowSystem === null ? true : cachedFollowSystem === 'true';
                const systemTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
                const theme = followSystem ? systemTheme : cachedTheme === 'dark' || cachedTheme === 'light' ? cachedTheme : systemTheme;
                document.documentElement.setAttribute('data-bs-theme', theme);
                document.querySelector('meta[name="theme-color"]')?.setAttribute('content', theme === 'dark' ? '#111827' : '#f4f5f9');

                const cachedScreenTheme = localStorage.getItem('screenTheme');
                if (cachedScreenTheme === 'light' || cachedScreenTheme === 'dark') {
                    document.documentElement.setAttribute('data-screen-theme', cachedScreenTheme);
                }
            })();
        </script>
        <meta name="description" content="OpenHAPanel" />
        <link rel="icon" href="<%= favicon %>" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" />
        <link rel="stylesheet" crossorigin="anonymous" href="https://cdn.jsdelivr.net/npm/misans@5.0.0/lib/Normal/MiSans-Normal.min.css" />
        <link rel="stylesheet" crossorigin="anonymous" href="https://cdn.jsdelivr.net/npm/misans@5.0.0/lib/Normal/MiSans-Regular.min.css" />
        <link rel="stylesheet" crossorigin="anonymous" href="https://cdn.jsdelivr.net/npm/misans@5.0.0/lib/Normal/MiSans-Medium.min.css" />
        <title>OpenHAPanel</title>
    </head>
    <body>
        <div id="app"></div>
        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
